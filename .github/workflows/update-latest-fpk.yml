name: 更新 latest 安装包

# 每次发布新版本（Release published）后，自动重新打包 x86 / arm64 安装包：
#   1) 覆盖写入 latest/ 目录（文件名固定、不含版本号），提供恒定下载链接：
#      https://raw.githubusercontent.com/12hgl/fnos_music_ext/main/latest/fnmusic-ext.fpk
#      https://raw.githubusercontent.com/12hgl/fnos_music_ext/main/latest/fnmusic-ext-arm64.fpk
#   2) 将版本化安装包附加到该 Release 的 Assets（fnmusic-ext-<版本>.fpk / -arm64.fpk）。
#   3) 依据 latest/ 重新生成根目录 fnpack.json（FnDepot 外部源 V2），保证
#      外部源里的版本号 / 下载地址 / 大小 / sha256 与 latest/ 始终一致。
# 参考 v3.1.0 的历史发布形态（不带 .sha256 校验文件）。
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-latest-fpk
  cancel-in-progress: false

jobs:
  update-latest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main 分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 安装打包依赖
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: 打包 x86
        run: bash packaging/fpk/build.sh --platform x86

      - name: 打包 arm64
        run: bash packaging/fpk/build.sh --platform arm

      - name: 写入 latest 目录（固定文件名，不含版本号）
        run: |
          set -euo pipefail
          VERSION="$(head -n1 VERSION | tr -d '[:space:]')"
          mkdir -p latest
          cp -f "dist/fnmusic-ext-${VERSION}.fpk" latest/fnmusic-ext.fpk
          cp -f "dist/fnmusic-ext-${VERSION}-arm64.fpk" latest/fnmusic-ext-arm64.fpk
          ls -l latest

      - name: 重新生成外部应用源 fnpack.json
        run: python3 packaging/fpk/gen_fnpack_json.py

      - name: 附加版本化安装包到 Release Assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(head -n1 VERSION | tr -d '[:space:]')"
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/fnmusic-ext-${VERSION}.fpk" \
            "dist/fnmusic-ext-${VERSION}-arm64.fpk" \
            --repo "${{ github.repository }}" --clobber
          gh release view "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) bytes"' || true

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f latest/fnmusic-ext.fpk latest/fnmusic-ext-arm64.fpk fnpack.json
          if git diff --cached --quiet; then
            echo "latest 安装包与 fnpack.json 无变化，跳过提交"
            exit 0
          fi
          git commit -m "更新最新安装包"
          git push origin HEAD:main