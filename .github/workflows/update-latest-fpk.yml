name: 更新 latest 安装包

# 每次发布新版本（Release published）后，自动重新打包 x86 / arm64 安装包，
# 覆盖写入 latest/ 目录（文件名固定、不含版本号），提供恒定下载链接：
#   https://raw.githubusercontent.com/12hgl/fnos_music_ext/main/latest/fnmusic-ext.fpk
#   https://raw.githubusercontent.com/12hgl/fnos_music_ext/main/latest/fnmusic-ext-arm64.fpk
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-latest-fpk
  cancel-in-progress: false

jobs:
  update-latest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 main 分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 安装打包依赖
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: 打包 x86
        run: bash packaging/fpk/build.sh --platform x86

      - name: 打包 arm64
        run: bash packaging/fpk/build.sh --platform arm

      - name: 写入 latest 目录（固定文件名，不含版本号）
        run: |
          set -euo pipefail
          VERSION="$(head -n1 VERSION | tr -d '[:space:]')"
          mkdir -p latest
          cp -f "dist/fnmusic-ext-${VERSION}.fpk" latest/fnmusic-ext.fpk
          cp -f "dist/fnmusic-ext-${VERSION}-arm64.fpk" latest/fnmusic-ext-arm64.fpk
          ls -l latest

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f latest/fnmusic-ext.fpk latest/fnmusic-ext-arm64.fpk
          if git diff --cached --quiet; then
            echo "latest 安装包无变化，跳过提交"
            exit 0
          fi
          git commit -m "更新最新安装包"
          git push origin HEAD:main